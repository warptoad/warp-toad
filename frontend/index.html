<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/warptoad-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarpToad</title>
    <script>
      // Set theme class before paint to avoid flash. Mirrors the resolution
      // logic in src/lib/stores/theme.svelte.ts.
      (function () {
        try {
          var stored = localStorage.getItem("warptoad-theme");
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : (window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches)
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
