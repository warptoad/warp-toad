version: '3.8'

services:
  bridge-sync:
    build:
      context: ..
      dockerfile: bridge-sync/Dockerfile
    container_name: bridge-sync
    ports:
      - "127.0.0.1:6969:6969"
    environment:
      - NODE_ENV=production
      - PORT=6969
    env_file:
      - .env
    volumes:
      - ./logs:/app/bridge-sync/logs
      - ./db:/app/bridge-sync/db
    restart: unless-stopped
    networks:
      - bridge-network

networks:
  bridge-network:
    driver: bridge
